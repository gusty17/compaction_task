connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://warehouse/
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
iceberg.file-format=PARQUET

# Trino refuses expire_snapshots / remove_orphan_files below these thresholds,
# and both default to 7d. Snapshots on this local stack are minutes old, so the
# default would silently expire nothing and compaction would look broken.
# LOCAL STACK ONLY -- in production leave these at the default: they are the
# guard that stops a short retention from deleting files an in-flight write
# has staged but not yet committed.
iceberg.expire-snapshots.min-retention=0s
iceberg.remove-orphan-files.min-retention=0s
