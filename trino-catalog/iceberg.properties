connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://warehouse/
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
iceberg.file-format=PARQUET

# Trino refuses to delete files that are younger than this threshold, and defaults to 7 days.
iceberg.expire-snapshots.min-retention=0s
iceberg.remove-orphan-files.min-retention=0s
# Trino refuses to write files larger than this threshold, and defaults to 512MB.
iceberg.target-max-file-size=512MB

# Delete files after commit, rather than leaving them in the table's metadata for
iceberg.delete-after-commit-enabled=true
iceberg.max-previous-versions=5
